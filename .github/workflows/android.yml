name: Build Android (APK + Play Store AAB)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v6
        with: { gradle-version: "8.11.1" }

      - name: Bundle the web app into the Android app
        run: |
          set -e
          test -f demo.html
          mkdir -p android/app/src/main/assets
          cp demo.html android/app/src/main/assets/index.html

      - name: Version name from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Debug APK (always)
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Signed release (needs the keystore secrets)
        if: env.KS_B64 != ''
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          gradle bundleRelease assembleRelease --no-daemon

      - uses: actions/upload-artifact@v7
        with:
          name: Hazen-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v7
        if: env.KS_B64 != ''
        with:
          name: Hazen-release-aab-and-apk
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk

      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/') && env.KS_B64 != ''
        uses: softprops/action-gh-release@v3
        with:
          files: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
