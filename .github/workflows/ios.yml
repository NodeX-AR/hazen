name: Build iOS (App Store / TestFlight)

# Needs an Apple Developer account (99 USD/year). Without the secrets this only checks that the iOS project builds.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  ios:
    runs-on: macos-15
    env:
      P12: ${{ secrets.IOS_CERT_P12_BASE64 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm install && npm run www && npx cap add ios && npx cap sync ios
      - name: Install CocoaPods dependencies
        run: cd ios/App && pod install
      - name: Show workspace
        run: ls ios/App

      - name: Camera, microphone and photo permission texts
        run: |
          P=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string Hazen uses the camera to take photos and videos." $P
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string Hazen uses the microphone to record sound with your videos." $P
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string Hazen lets you import photos and videos to edit." $P
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryAddUsageDescription string Hazen saves your photos and videos to your library." $P
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" $P

      - name: Build check (simulator, no signing)
        if: env.P12 == ''
        run: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build

      - name: Archive, sign and upload to TestFlight
        if: env.P12 != ''
        env:
          P12_PASSWORD: ${{ secrets.IOS_CERT_P12_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROFILE_BASE64 }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          KC=$RUNNER_TEMP/b.keychain; security create-keychain -p x $KC; security default-keychain -s $KC; security unlock-keychain -p x $KC
          echo "$P12" | base64 -d > $RUNNER_TEMP/c.p12; security import $RUNNER_TEMP/c.p12 -k $KC -P "$P12_PASSWORD" -T /usr/bin/codesign; security set-key-partition-list -S apple-tool:,apple: -s -k x $KC
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles; echo "$PROFILE_B64" | base64 -d > $RUNNER_TEMP/p.mobileprovision
          UUID=$(grep -a -A1 UUID $RUNNER_TEMP/p.mobileprovision | grep -o '[-A-Za-z0-9]\{36\}' | head -1); cp $RUNNER_TEMP/p.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision
          NAME=$(security cms -D -i $RUNNER_TEMP/p.mobileprovision | plutil -extract Name raw -)
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release -archivePath $RUNNER_TEMP/App.xcarchive archive CURRENT_PROJECT_VERSION=${{ github.run_number }} DEVELOPMENT_TEAM=$TEAM_ID CODE_SIGN_STYLE=Manual PROVISIONING_PROFILE_SPECIFIER="$NAME" CODE_SIGN_IDENTITY="Apple Distribution"
          printf '<plist version="1.0"><dict><key>method</key><string>app-store-connect</string><key>teamID</key><string>%s</string><key>signingStyle</key><string>manual</string><key>provisioningProfiles</key><dict><key>app.hazen.camera</key><string>%s</string></dict></dict></plist>' "$TEAM_ID" "$NAME" > $RUNNER_TEMP/export.plist
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/App.xcarchive -exportPath $RUNNER_TEMP/out -exportOptionsPlist $RUNNER_TEMP/export.plist
          mkdir -p ~/.appstoreconnect/private_keys; echo "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          xcrun altool --upload-app -f $RUNNER_TEMP/out/App.ipa -t ios --apiKey $ASC_KEY_ID --apiIssuer $ASC_ISSUER_ID
